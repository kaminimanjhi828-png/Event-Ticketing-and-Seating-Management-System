<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Eventify</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/app.css">
</head>

<body>

    <!-- Header -->
    <header>

        <nav class="navbar container">

            <a href="index.html" class="logo">
                Eventify
            </a>

            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="about.html">About</a>
                </li>

                <li>
                    <a href="services.html">Events</a>
                </li>

                <li>
                    <a href="login.html">Login</a>
                </li>

                <li>
                    <a href="register.html" class="nav-button">
                        Register
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <main>

        <!-- Login Section -->
        <section class="auth-container">

            <div class="container">

                <div class="form-container auth-box">

                    <div class="auth-title">

                        <h1>Welcome Back</h1>

                        <p>
                            Login to continue your Eventify journey.
                        </p>

                    </div>


                    <form action="#" method="post">

                        <!-- Email -->
                        <div class="form-group">

                            <label for="email">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                required
                            >

                        </div>


                        <!-- Password -->
                        <div class="form-group">

                            <label for="password">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required
                            >

                        </div>


                        <!-- Remember Me -->
                        <div class="form-check">

                            <input
                                type="checkbox"
                                id="remember"
                                name="remember"
                            >

                            <label for="remember">
                                Remember Me
                            </label>

                        </div>


                        <!-- Login Button -->
                        <button
                            type="submit"
                            class="btn btn-full"
                        >
                            Login
                        </button>

                    </form>


                    <!-- Forgot Password -->
                    <p class="text-center mt-20">

                        <a href="#" class="form-link">
                            Forgot Password?
                        </a>

                    </p>


                    <!-- Register Link -->
                    <p class="text-center mt-20">

                        Don't have an account?

                        <a
                            href="register.html"
                            class="form-link"
                        >
                            Register Now
                        </a>

                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <div class="container">

            <div class="footer-links">

                <a href="index.html">Home</a>

                <a href="about.html">About</a>

                <a href="services.html">Events</a>

                <a href="login.html">Login</a>

                <a href="register.html">Register</a>

                <a href="legal.html">Legal</a>

            </div>

            <p>
                &copy; 2026 Eventify. All rights reserved.
            </p>

        </div>

    </footer>

    <script src="js/app.js" defer></script>
</body>

</html>
