<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Eventify</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/app.css">
</head>

<body>

    <!-- Header -->
    <header>

        <nav class="navbar container">

            <a href="index.html" class="logo">
                Eventify
            </a>

            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="about.html">About</a>
                </li>

                <li>
                    <a href="services.html">Events</a>
                </li>

                <li>
                    <a href="login.html">Login</a>
                </li>

                <li>
                    <a href="register.html" class="nav-button">
                        Register
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <main>

        <!-- Registration Section -->
        <section class="auth-container">

            <div class="container">

                <div class="form-container auth-box">

                    <div class="auth-title">

                        <h1>Create Your Account</h1>

                        <p>
                            Join Eventify and discover amazing experiences.
                        </p>

                    </div>


                    <form action="#" method="post">

                        <!-- Full Name -->
                        <div class="form-group">

                            <label for="fullname">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="fullname"
                                name="fullname"
                                placeholder="Enter your full name"
                                required
                            >

                        </div>


                        <!-- Email -->
                        <div class="form-group">

                            <label for="email">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                required
                            >

                        </div>


                        <!-- Password -->
                        <div class="form-group">

                            <label for="password">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Create a password"
                                required
                            >

                        </div>


                        <!-- Confirm Password -->
                        <div class="form-group">

                            <label for="confirm-password">
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                id="confirm-password"
                                name="confirm-password"
                                placeholder="Confirm your password"
                                required
                            >

                        </div>


                        <!-- Phone -->
                        <div class="form-group">

                            <label for="phone">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="Enter your phone number"
                                required
                            >

                        </div>


                        <!-- Gender -->
                        <div class="form-group">

                            <label>
                                Gender
                            </label>

                            <div class="radio-group">

                                <label class="radio-option">

                                    <input
                                        type="radio"
                                        name="gender"
                                        value="male"
                                        required
                                    >

                                    Male

                                </label>


                                <label class="radio-option">

                                    <input
                                        type="radio"
                                        name="gender"
                                        value="female"
                                    >

                                    Female

                                </label>


                                <label class="radio-option">

                                    <input
                                        type="radio"
                                        name="gender"
                                        value="other"
                                    >

                                    Other

                                </label>

                            </div>

                        </div>


                        <!-- Course / Interest -->
                        <div class="form-group">

                            <label for="interest">
                                Course / Interest
                            </label>

                            <select
                                id="interest"
                                name="interest"
                                required
                            >

                                <option value="">
                                    Select your interest
                                </option>

                                <option value="music">
                                    Music & Concerts
                                </option>

                                <option value="technology">
                                    Technology
                                </option>

                                <option value="sports">
                                    Sports
                                </option>

                                <option value="workshops">
                                    Workshops
                                </option>

                                <option value="food">
                                    Food & Festivals
                                </option>

                                <option value="comedy">
                                    Comedy
                                </option>

                            </select>

                        </div>


                        <!-- Terms -->
                        <div class="form-check">

                            <input
                                type="checkbox"
                                id="terms"
                                name="terms"
                                required
                            >

                            <label for="terms">

                                I agree to the
                                <a
                                    href="legal.html"
                                    class="form-link"
                                >
                                    Terms & Conditions
                                </a>

                            </label>

                        </div>


                        <!-- Submit -->
                        <button
                            type="submit"
                            class="btn btn-full"
                        >
                            Create Account
                        </button>

                    </form>


                    <!-- Login Link -->
                    <p class="text-center mt-20">

                        Already have an account?

                        <a
                            href="login.html"
                            class="form-link"
                        >
                            Login Here
                        </a>

                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <div class="container">

            <div class="footer-links">

                <a href="index.html">Home</a>

                <a href="about.html">About</a>

                <a href="services.html">Events</a>

                <a href="login.html">Login</a>

                <a href="register.html">Register</a>

                <a href="legal.html">Legal</a>

            </div>

            <p>
                &copy; 2026 Eventify. All rights reserved.
            </p>

        </div>

    </footer>

    <script src="js/app.js" defer></script>
</body>

</html>
